name: Cache cleanup
on:
  schedule:
    - cron: "53 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hestia-gc
  cancel-in-progress: false
jobs:
  gc:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write # Hestia GC deletes unused cache entries.
      contents: read
    steps:
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: true
      - name: Remove unused cache entries
        run: '"$HESTIA_BIN" gc'
        env:
          GITHUB_TOKEN: ${{ github.token }}
