version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    groups:
      nix-inputs:
        patterns: ["*"]
        exclude-patterns: ["advisory-db"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
