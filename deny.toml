[licenses]
# This allowlist applies to future dependencies as well as current ones.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "syn@2", reason = "zeroize_derive and curve25519-dalek-derive (via ohttp/hpke) have no syn 3 release yet" },
  { crate = "winnow@0.7", reason = "toml 0.9 (ohttp build script) uses winnow 0.7 while its toml_parser uses 1.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
