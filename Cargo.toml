[workspace]
members = ["crates/hartig", "crates/pubsub"]
resolver = "3"

[workspace.metadata.crane]
name = "hartig"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fungi-protocol/hartig"

[workspace.dependencies]
sha2 = "0.10"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
