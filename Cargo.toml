[workspace]
members = ["crates/hartig", "crates/ohttp", "crates/pubsub"]
resolver = "3"

[workspace.metadata.crane]
name = "hartig"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fungi-protocol/hartig"

[workspace.dependencies]
axum = "0.8.9"
bhttp = { version = "0.8", default-features = false }
http = "1"
ohttp = { version = "0.8", default-features = false }
sha2 = "0.11"
thiserror = "2.0.21"
tokio = "1.53.2"
tower = "0.5.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
