[workspace]
members = ["crates/hartig", "crates/pubsub", "crates/pubsub-client"]
resolver = "3"

[workspace.metadata.crane]
name = "hartig"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fungi-protocol/hartig"

[workspace.dependencies]
axum = "0.8.9"
bytes = "1.12.1"
hartig-pubsub = { path = "crates/pubsub" }
hex = "0.4.3"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-util = "0.1.21"
pubsub-client = { path = "crates/pubsub-client" }
sha2 = "0.11"
thiserror = "2.0.21"
tokio = "1.53.2"
tower = "0.5.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
